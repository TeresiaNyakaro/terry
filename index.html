<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Errands Request</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Request an Errand</h2>
    <form id="errandForm">

      <label for="name">Your Name:</label>
      <input type="text" id="name" required placeholder="e.g., Jane Doe">

      <label for="phone">Your Phone:</label>
      <input type="tel" id="phone" required placeholder="e.g., 0712 345678">

      <label for="type">Errand Type:</label>
      <select id="type" required>
        <option value="">-- Select --</option>
        <option value="Pick Up">Pick Up</option>
        <option value="Delivery">Delivery</option>
        <option value="Shopping">Shopping</option>
        <option value="Bill Payment">Bill Payment</option>
        <option value="Other">Other</option>
      </select>

      <label for="task">Errand Details:</label>
      <textarea id="task" required placeholder="e.g., Pick up groceries"></textarea>
      
      <label for="time">Preferred Time:</label>
      <input type="text" id="time" required placeholder="e.g., 3 PM today">
      
      <label for="location">Location:</label>
      <input type="text" id="location" required placeholder="e.g., Machakos town">

      <label for="urgency">Urgency:</label>
      <select id="urgency" required>
        <option value="Normal">Normal</option>
        <option value="Urgent">Urgent</option>
      </select>

      <label for="budget">Budget (Ksh):</label>
      <input type="number" id="budget" placeholder="e.g., 500">

      <label for="notes">Extra Notes:</label>
      <textarea id="notes" placeholder="Any other details..."></textarea>

      <button type="submit">Send via WhatsApp</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
